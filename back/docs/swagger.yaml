              type: object
      summary: Barcha tibbiy mutaxassisliklar ro‘yxati
      tags:
      - Specialties
  /api/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: Faqat JPEG, PNG, WebP formatlari, maksimal hajm 5MB
      parameters:
      - description: Rasm fayli
        in: formData
        name: file
        required: true
        type: file
      - description: 'Papka nomi (masalan: clinics yoki doctors)'
        in: query
        name: folder
        type: string
      produces:
      - application/json
      responses:
