        "200":
          description: Mutaxassisliklar ro‘yxati
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.SpecialtyDTO'
