      tags:
      - Public Search
  /api/v1/public/regions:
    get:
      description: Tasdiqlangan klinikalar mavjud bo‘lgan hududlar ro‘yxati
      produces:
      - application/json
      responses:
        "200":
          description: Hududlar katalogi
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.RegionItemDTO'
