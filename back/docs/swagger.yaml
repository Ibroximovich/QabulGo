                    $ref: '#/definitions/dto.NearbyClinicItemDTO'
                  type: array
              type: object
        "400":
          description: Noto‘g‘ri koordinata yoki parametrlar
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Server xatosi
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Bemor lokatsiyasiga eng yaqin tasdiqlangan klinikalarni topish
      tags:
      - Public Search
  /api/v1/public/doctors:
    get:
      description: Ism, familiya, mutaxassislik, hudud, narx oralig‘i bo‘yicha qidirish
        va saralash
      parameters:
      - description: Shifokor ismi, familiyasi yoki tavsifi
        in: query
        name: search
        type: string
      - description: Viloyat
        in: query
        name: region
        type: string
      - description: Tuman
        in: query
        name: district
        type: string
      - description: Mutaxassislik ID
        in: query
        name: specialty_id
        type: string
      - description: Muayyan klinika ID
        in: query
        name: clinic_id
        type: string
      - description: Minimal narx (so‘m)
        in: query
        name: min_price
        type: number
      - description: Maksimal narx (so‘m)
        in: query
        name: max_price
        type: number
      - description: Saralash (price_asc, price_desc, experience_desc, name_asc)
        in: query
        name: sort
        type: string
      - description: Sahifa (default 1)
        in: query
        name: page
        type: integer
      - description: Miqdor (default 12, max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Shifokorlar ro‘yxati
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.PublicDoctorItemDTO'
                  type: array
              type: object
        "500":
          description: Server xatosi
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Shifokorlarni ommaviy qidirish va filtrlash
      tags:
      - Public Search
  /api/v1/public/doctors/{id}:
    get:
      description: Shifokor ma’lumotlari va u qabul qiladigan barcha tasdiqlangan
        klinikalar hamda narxlari
      parameters:
      - description: Shifokor UUID yoki ClinicDoctor UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Shifokor tafsilotlari
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PublicDoctorDetailDTO'
              type: object
        "400":
          description: ID formati noto‘g‘ri
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Shifokor topilmadi
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
