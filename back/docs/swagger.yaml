      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Kod qayta yuborildi
