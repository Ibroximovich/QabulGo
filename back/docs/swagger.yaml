    type: object
host: localhost:8080
info:
  contact:
    email: support@qabulgo.uz
    name: QabulGo Support
  description: 'QabulGo — O‘zbekistondagi xususiy klinikalar, shifokorlar va bemorlarni
    bog‘lovchi platforma (1-bosqich: Bemorlar uchun Authentication).'
  title: QabulGo Backend API
  version: "1.0"
paths:
  /api/v1/admin/clinics:
    get:
      description: Status bo‘yicha filtrlash (draft, pending, approved, rejected,
        suspended), qidiruv va sahifalash
      parameters:
      - description: 'Status (masalan: pending)'
        in: query
        name: status
        type: string
      - description: Qidiruv
        in: query
        name: search
        type: string
      - description: Sahifa
        in: query
        name: page
        type: integer
      - description: Miqdor
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Klinikalar ro‘yxati
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/qabulgo-backend_internal_dto.ClinicSummaryDTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Superadmin uchun klinikalar ro‘yxati
      tags:
      - Superadmin
  /api/v1/admin/clinics/{id}:
    get:
      description: Klinika ma’lumotlari, ish vaqtlari, shifokorlar soni va audit tarixi
      parameters:
      - description: Klinika UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Klinika tafsilotlari
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/qabulgo-backend_internal_dto.ClinicDetailDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Superadmin uchun klinika to‘liq ma’lumotlari va tekshiruv tarixi
      tags:
      - Superadmin
  /api/v1/admin/clinics/{id}/approve:
    post:
      description: 'Superadmin klinikani tasdiqlaydi (status: approved) va tizimda
        faol qiladi'
      parameters:
      - description: Klinika UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Klinika muvaffaqiyatli tasdiqlandi
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Klinikani tasdiqlash
      tags:
      - Superadmin
  /api/v1/admin/clinics/{id}/reject:
    post:
      consumes:
      - application/json
      description: 'Superadmin arizani rad etadi va sababini qayd qiladi (status:
        rejected)'
      parameters:
      - description: Klinika UUID
        in: path
        name: id
        required: true
        type: string
      - description: Rad etish sababi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.AdminReviewClinicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Klinika rad etildi
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Klinikani rad etish
      tags:
      - Superadmin
  /api/v1/admin/clinics/{id}/suspend:
    post:
      consumes:
      - application/json
      description: 'Superadmin qoidabuzarlik yoki tekshiruv tufayli klinikani bloklaydi
        (status: suspended)'
      parameters:
      - description: Klinika UUID
        in: path
        name: id
        required: true
        type: string
      - description: Bloklash sababi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.AdminReviewClinicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Klinika bloklandi
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Klinikani bloklash / to‘xtatish
      tags:
      - Superadmin
  /api/v1/auth/admin/login:
    post:
      consumes:
      - application/json
      description: Faqat superadmin huquqiga ega foydalanuvchilar kirishi uchun
      parameters:
      - description: Superadmin login ma’lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.SuperAdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Muvaffaqiyatli kirildi
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/qabulgo-backend_internal_dto.LoginData'
              type: object
        "401":
          description: Email yoki parol noto‘g‘ri
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
        "403":
          description: Ruxsat berilmagan
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
      summary: Superadmin paneliga kirish
      tags:
      - Auth
  /api/v1/auth/clinic/login:
    post:
      consumes:
      - application/json
      description: Email va parol orqali tizimga kiradi (faqat clinic_owner yoki clinic_admin)
      parameters:
      - description: Klinika login ma’lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.ClinicLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Muvaffaqiyatli kirildi
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/qabulgo-backend_internal_dto.LoginData'
              type: object
        "401":
          description: Email yoki parol noto‘g‘ri
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
        "403":
          description: Email tasdiqlanmagan yoki ruxsat yo‘q
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
      summary: Klinika kabinetiga kirish
      tags:
      - Auth
  /api/v1/auth/clinic/register:
    post:
      consumes:
      - application/json
      description: Yangi klinika egasini ro‘yxatdan o‘tkazadi va emailga tasdiqlash
        kodi yuboradi
      parameters:
      - description: Klinika egasi ro‘yxatdan o‘tish ma’lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.ClinicRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Muvaffaqiyatli ro‘yxatdan o‘tildi
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/qabulgo-backend_internal_dto.PatientRegisterData'
              type: object
        "400":
          description: Noto‘g‘ri ma’lumot kiritilgan
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
        "409":
          description: Email yoki telefon allaqachon mavjud
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
        "422":
          description: Validatsiya xatoligi
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
      summary: Klinika egasi ro‘yxatdan o‘tishi
      tags:
      - Auth
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Email kiritiladi, agar mavjud bo‘lsa parolni tiklash kodi yuboriladi
      parameters:
      - description: Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tiklash kodi yuborildi
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
      summary: Parolni unutganda tiklash so‘rovi
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Refresh token sessiyasini bekor qiladi va cookie'ni tozalaydi
      produces:
      - application/json
      responses:
        "200":
          description: Muvaffaqiyatli chiqildi
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
      summary: Kabinetdan chiqish
      tags:
      - Auth
  /api/v1/auth/patient/login:
    post:
      consumes:
      - application/json
      description: Email va parol orqali tizimga kiradi, access token va HttpOnly
        refresh token cookie qaytaradi
      parameters:
      - description: Login ma’lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.PatientLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Muvaffaqiyatli kirildi
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/qabulgo-backend_internal_dto.LoginData'
              type: object
        "401":
          description: Email yoki parol noto‘g‘ri
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
        "403":
          description: Email tasdiqlanmagan yoki akkaunt bloklangan
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
      summary: Bemor kabinetiga kirish
      tags:
      - Auth
  /api/v1/auth/patient/register:
    post:
      consumes:
      - application/json
      description: Yangi bemor foydalanuvchini ro‘yxatdan o‘tkazadi va emailga tasdiqlash
        kodi yuboradi
      parameters:
      - description: Ro‘yxatdan o‘tish ma’lumotlari
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qabulgo-backend_internal_dto.PatientRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Muvaffaqiyatli ro‘yxatdan o‘tildi
          schema:
            allOf:
            - $ref: '#/definitions/qabulgo-backend_internal_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/qabulgo-backend_internal_dto.PatientRegisterData'
              type: object
        "400":
          description: Noto‘g‘ri ma’lumot kiritilgan
          schema:
            $ref: '#/definitions/qabulgo-backend_internal_dto.ErrorResponse'
        "409":
          description: Email yoki telefon allaqachon mavjud
