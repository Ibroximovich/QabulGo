host: localhost:8080
info:
  contact:
    email: support@qabulgo.uz
    name: QabulGo Support
  description: 'QabulGo — O‘zbekistondagi xususiy klinikalar, shifokorlar va bemorlarni
    bog‘lovchi platforma (1-bosqich: Bemorlar uchun Authentication).'
  title: QabulGo Backend API
  version: "1.0"
paths:
  /api/v1/admin/clinics:
    get:
      description: Status bo‘yicha filtrlash (draft, pending, approved, rejected,
        suspended), qidiruv va sahifalash
      parameters:
      - description: 'Status (masalan: pending)'
        in: query
        name: status
        type: string
      - description: Qidiruv
        in: query
        name: search
        type: string
