services:
  postgres:
    image: postgres:16-alpine
    container_name: qabulgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qabulgo
      POSTGRES_PASSWORD: qabulgo_secret_2026
      POSTGRES_DB: qabulgo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qabulgo -d qabulgo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
